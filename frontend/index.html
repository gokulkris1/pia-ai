<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#05070a" />
  <title>Pia</title>
  <link rel="stylesheet" href="/static/style.css?v=20260610-friendly-url" />
</head>
<body>
  <main class="app-shell" aria-label="Pia voice interface">
    <header class="top-bar">
      <button class="icon-button" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v1.8H4V7Zm0 4.1h16v1.8H4v-1.8Zm0 4.1h16V17H4v-1.8Z"/></svg>
      </button>
      <div class="wordmark">pia</div>
      <button class="icon-button" type="button" aria-label="History">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.45 5.08H2.2A10 10 0 1 0 5.1 5.1L3 3v5.9h5.9L6.55 6.55A7.95 7.95 0 0 1 12 4Zm-1 3.5h2v5.1l4.05 2.4-1 1.7L11 13.7V7.5Z"/></svg>
      </button>
    </header>

    <section class="mode-band" aria-label="Pia modes">
      <span class="mode-chip">claude</span>
      <span class="mode-chip">ask first</span>
      <span class="mode-chip">1 agent</span>
    </section>

    <section class="orb-band" aria-label="Pia orb">
      <canvas id="orb-canvas" class="orb-canvas" width="720" height="720"></canvas>
    </section>

    <section class="status-band" aria-live="polite">
      <p id="status-line" class="status-line">tap to speak</p>
      <p id="status-subline" class="status-subline">pia is listening for you</p>
      <div id="model-pill" class="model-pill">claude · hardcoded</div>
      <div id="transcript" class="transcript" role="status"></div>
      <form id="text-form" class="text-form" autocomplete="off" hidden>
        <input id="text-input" class="text-input" type="text" name="message" aria-label="Type to Pia" placeholder="Ask Pia" />
        <button class="text-send" type="submit" aria-label="Send typed message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3 10.1l10.8 1.9L3 13.9l.4 6.5Z"/></svg>
        </button>
      </form>
    </section>

    <footer class="dock" aria-label="Voice controls">
      <button id="keyboard-button" class="ghost-action" type="button" aria-label="Type to Pia">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2Zm0 2v8h16V8H4Zm2 1.5h2v2H6v-2Zm3 0h2v2H9v-2Zm3 0h2v2h-2v-2Zm3 0h2v2h-2v-2Zm-8 3h10v2H7v-2Z"/></svg>
      </button>
      <button id="mic-button" class="mic-action" type="button" aria-label="Start speaking">
        <svg id="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <button id="end-button" class="ghost-action" type="button" aria-label="End conversation" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-3.24 0-6.22 1.1-8.6 2.95-.52.4-.57 1.17-.1 1.64l2.1 2.1c.37.37.95.4 1.36.1.7-.52 1.45-.96 2.24-1.28.37-.15.61-.52.61-.92v-1.56A11.4 11.4 0 0 1 12 11.8c.83 0 1.63.08 2.39.23v1.56c0 .4.24.77.61.92.79.32 1.54.76 2.24 1.28.41.3.99.27 1.36-.1l2.1-2.1c.47-.47.42-1.24-.1-1.64A13.88 13.88 0 0 0 12 9Z"/></svg>
      </button>
    </footer>
  </main>

  <script src="/static/config.js?v=20260610-friendly-url"></script>
  <script src="/static/orb.js?v=20260610-friendly-url"></script>
  <script src="/static/app.js?v=20260610-friendly-url"></script>
</body>
</html>
